# Stage 2 + 3 + 4：AI 初审 -> 分诊降噪 -> 分级动作
# 复制到目标仓库 .github/workflows/ai-review.yml
# 前置：仓库 secrets 配置 TRIAGE_API_KEY（分诊模型密钥）；.pr_agent.toml 已在仓库根
name: ai-review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # 分诊依赖初审评论已存在；synchronize 触发时 PR-Agent Action 先跑，本 job 读取其评论

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # 爆炸半径的三点 diff 需要 merge-base，浅克隆会 exit 128

      # ---- Stage 2a：diff 规模判定 + 超预算分片初审（全量覆盖，防静默丢文件）----
      # 托管 Action 是单遍审查，diff 超 ~1200 行即开始整文件丢弃（custom_model_max_tokens=16000）。
      # 超预算时改走本仓库自装引擎的分片审查（chunk_review.py：按文件切片 map-reduce），
      # 每片独立过审后合并 findings.json，走 JSON 直出通道（不经评论解析）。
      - name: 生成 pr.diff 并判定规模
        id: size
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          LINES=$(wc -l < pr.diff)
          OVERSIZE=$([ "$LINES" -gt 1200 ] && echo yes || echo no)
          echo "lines=$LINES oversize=$OVERSIZE"
          echo "oversize=$OVERSIZE" >> "$GITHUB_OUTPUT"

      - name: 分片初审（超预算 PR：全量覆盖）
        if: steps.size.outputs.oversize == 'yes'
        env:
          OPENAI_KEY: ${{ secrets.MINIMAX_KEY }}
          CONFIG.MODEL: openai/MiniMax-M3
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "16000"
          OPENAI.API_BASE: https://api.minimaxi.com/v1
          PR_REVIEWER.FINDINGS_OUTPUT_FILE: chunk-engine.json
          PR_REVIEWER.FINDINGS_OUTPUT_ROOT: ${{ github.workspace }}
        run: |
          # 本仓库即 pr-agent 引擎（fork）：装环境 → 分片跑
          pip install uv 2>/dev/null || true
          uv venv .venv --python 3.12 && uv pip install -e . --python .venv/bin/python
          export PR_AGENT_BIN="$PWD/.venv/bin/pr-agent"
          export FINDINGS_OUT="$PWD/chunk-engine.json"
          python3 scripts/chunk_review.py --diff pr.diff \
            --out findings.json --config config/pipeline.json --max-chunk-tokens 7000

      # ---- Stage 2b：常规 PR 走托管 Action（单遍可完整覆盖）----
      - name: PR-Agent 初审（MiniMax-M3，OpenAI 兼容通道）
        if: steps.size.outputs.oversize != 'yes'
        uses: Codium-ai/pr-agent@e13da4fdda9903c8c7d1c9ba22f671b43f56039b  # main
        # 传参方式经源码核实（github_action_runner.py + dynaconf env_loader）：
        # GITHUB_TOKEN/OPENAI_KEY 走 env；其余配置用点分环境变量覆盖
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.MINIMAX_KEY }}
          OPENAI.API_BASE: https://api.minimaxi.com/v1
          CONFIG.MODEL: openai/MiniMax-M3
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "16000"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
          # synchronize（新推送）默认不跑命令，显式开启并只跑 /review
          GITHUB_ACTION_CONFIG.HANDLE_PUSH_TRIGGER: "true"
          GITHUB_ACTION_CONFIG.PUSH_COMMANDS: '["/review"]'
        continue-on-error: true   # 初审失败不阻断（分诊层会给出空结果兜底）

      - name: 等待初审评论落盘
        if: steps.size.outputs.oversize != 'yes'
        run: sleep 150   # MiniMax 推理 2-3 分钟，等 review 评论发出后再分诊

      # ---- Stage 3：分诊降噪 ----
      # 分片路径：findings.json（JSON 直出）| 托管路径：从 bot 评论解析 [AI-FINDING]
      - name: 分诊
        env:
          TRIAGE_API_KEY: ${{ secrets.TRIAGE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA=""
          if [ -z "$TRIAGE_API_KEY" ]; then EXTRA="--dry-run"; fi
          if [ -f findings.json ]; then
            echo "[triage] 数据通道：JSON 直出（分片初审）"
            python3 scripts/triage.py \
              --findings findings.json \
              --diff pr.diff \
              --ledger config/noise_ledger.json \
              --config config/pipeline.json \
              --out triaged.json $EXTRA
          else
            echo "[triage] 数据通道：评论解析（托管初审）"
            python3 scripts/triage.py \
              --pr "${{ github.event.pull_request.html_url }}" \
              --ledger config/noise_ledger.json \
              --config config/pipeline.json \
              --out triaged.json $EXTRA
          fi

      # ---- Q3 爆炸半径检测（输出 escalate 信号，供人工/后续步骤决定升级）----
      - name: 爆炸半径检测
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          python3 scripts/blast_radius.py --diff pr.diff --repo . \
            --config config/pipeline.json > blast_radius.json || true
          cat blast_radius.json

      # ---- Stage 4：分级动作（critical -> status failure 阻断；其余蒸馏评论）----
      - name: 分级动作
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/post_review.py \
            --triaged triaged.json \
            --config config/pipeline.json \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --sha "${{ github.event.pull_request.head.sha }}"

  # ---- Stage 5（条件触发）：关键路径对抗深度审查 ----
  # blast_radius.escalate=true 或打 deep-review 标签时，用 harness agent 跑多 persona 对抗审查。
  # 参考实现（Claude Code headless）：
  #   claude -p "$(cat config/adversarial_prompt.txt)" --allowedTools Read,Grep,Bash > adversarial.md
  # 本模板留作接入点，按团队选用的 harness（Claude Code/OpenCode/dsh）填充。
  deep-review:
    if: contains(github.event.pull_request.labels.*.name, 'deep-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: 对抗深度审查（占位）
        run: |
          echo "TODO: 接入所选 harness agent 的 headless 对抗审查（见 README Stage 5）"
