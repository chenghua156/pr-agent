# Stage 2 + 3 + 4：AI 初审（自装引擎 JSON 直出）→ 分诊降噪 → 分级动作
# v3：彻底替换托管 Action —— 本仓库即 pr-agent 引擎，CI 直接跑 CLI，
#      JSON 直出 findings.json，跳过评论解析，消灭 [AI-FINDING] 契约失效
#      和托管 Action 的 continue-on-error 静默失败。
# 前置：仓库 secrets 配置 MODEL_KEY（初审模型密钥）；.pr_agent.toml 已在仓库根
name: ai-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      # ---- Stage 0: 生成 pr.diff ----
      - name: 生成 pr.diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          echo "diff 行数: $(wc -l < pr.diff)"

      # ---- Stage 2: 自装引擎初审（JSON 直出，不走评论解析）----
      # 本仓库即 pr-agent fork：uv 安装依赖 → CLI 直调 → findings.json
      # 优势：① [AI-FINDING] 契约存活（不经 Pydantic 格式转换）
      #       ② 分片审查全量覆盖（chunk_review.py）
      #       ③ 失败可见（不再 continue-on-error 吞错误）
      - name: 安装引擎
        run: |
          pip install uv
          uv venv .venv --python 3.12
          uv pip install -e . --python .venv/bin/python

      - name: 初审（直调引擎，简化排查）
        env:
          M_KEY: ${{ secrets.MINIMAX_KEY }}
          M_BASE: ${{ vars.MODEL_BASE || 'https://api.minimaxi.com/v1' }}
          M_NAME: ${{ vars.MODEL_NAME || 'openai/MiniMax-M3' }}
        run: |
          # 1) 写 .secrets.toml（本地验证过的格式）
          cat > pr_agent/settings/.secrets.toml <<TOML
          [config]
          model = "${M_NAME}"
          fallback_models = []
          custom_model_max_tokens = 16000
          ai_timeout = 300

          [openai]
          key = "${M_KEY}"
          api_base = "${M_BASE}"

          [pr_reviewer]
          findings_output_file = "ci-findings.json"
          findings_output_root = "${PWD}"
          num_max_findings = 8
          TOML

          # 2) 打印实际写入的文件（密钥脱敏）
          echo "── .secrets.toml 内容 ──"
          sed 's/key = ".*/key = "***"/' pr_agent/settings/.secrets.toml

          # 3) Dynaconf 冒烟：引擎自己能不能读到
          echo "── Dynaconf 冒烟 ──"
          .venv/bin/python -c "
          from pr_agent.config_loader import get_settings
          s = get_settings()
          print('model:', s.config.model)
          print('api_base:', s.openai.api_base)
          print('key_len:', len(s.openai.key) if s.openai.key else 0)
          " 2>&1

          # 4) 直接调引擎（不走 chunk_review 的 subprocess 包装）
          echo "── 直调引擎 ──"
          .venv/bin/pr-agent --diff-file pr.diff review 2>&1 | tail -20

          # 5) 检查 findings 是否产出
          if [ -f ci-findings.json ]; then
            echo "── findings 产出 ──"
            python3 -c "import json; d=json.load(open('ci-findings.json')); print('findings:', len(d.get('findings',[])))"
            cp ci-findings.json findings.json
          else
            echo "⚠️ 引擎未产出 findings.json"
            echo '{"source":"pr-agent","findings":[],"run":{}}' > findings.json
          fi
          rm -f pr_agent/settings/.secrets.toml

      # ---- Stage 3: 分诊降噪（JSON 直入，不走评论解析）----
      - name: 分诊
        env:
          TRIAGE_API_KEY: ${{ secrets.TRIAGE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA=""
          if [ -z "$TRIAGE_API_KEY" ]; then EXTRA="--dry-run"; fi
          if [ -f findings.json ]; then
            python3 scripts/triage.py \
              --findings findings.json \
              --diff pr.diff \
              --ledger config/noise_ledger.json \
              --config config/pipeline.json \
              --out triaged.json $EXTRA
          else
            echo '{"mode":"empty","findings":[],"archived":[],"summary":"初审引擎无产出"}' > triaged.json
          fi

      # ---- Q3: 爆炸半径检测 ----
      - name: 爆炸半径检测
        run: |
          python3 scripts/blast_radius.py --diff pr.diff --repo . \
            --config config/pipeline.json > blast_radius.json || true
          cat blast_radius.json

      # ---- Stage 4: 分级动作（critical → status failure 阻断）----
      - name: 分级动作
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/post_review.py \
            --triaged triaged.json \
            --config config/pipeline.json \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --sha "${{ github.event.pull_request.head.sha }}"

      # ---- 产物归档 ----
      - name: 归档
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-artifacts
          path: |
            findings.json
            triaged.json
            blast_radius.json
          if-no-files-found: ignore

  # ---- Stage 5（条件触发）：对抗深度审查 ----
  deep-review:
    if: contains(github.event.pull_request.labels.*.name, 'deep-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: 对抗深度审查（占位）
        run: |
          echo "TODO: 接入所选 harness agent 的 headless 对抗审查（见 README Stage 5）"
